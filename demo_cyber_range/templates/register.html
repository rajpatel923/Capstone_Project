{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card">
      <div class="card-header py-3">
        <span class="terminal">$ register_user</span>
      </div>
      <div class="card-body p-4">
        <form method="post" novalidate>
          <div class="mb-3">
            <label class="form-label text-secondary">Username</label>
            <input type="text" name="username" class="form-control" required autofocus autocomplete="username">
          </div>
          <div class="mb-3">
            <label class="form-label text-secondary">Password</label>
            <input type="password" name="password" class="form-control" required autocomplete="new-password">
          </div>
          <div class="mb-4">
            <label class="form-label text-secondary">
              FRZR BURN Member ID <span class="text-danger">*</span>
            </label>
            <input type="text" name="member_id"
                   class="form-control font-monospace"
                   pattern="\d{4}" maxlength="4" placeholder="e.g. 0636"
                   value="{{ request.args.get('member_id', '') }}"
                   required autocomplete="off">
            <div class="form-text text-secondary" style="font-size:.8rem">
              Your 4-digit ID from your FRZR BURN enrollment email.
            </div>
          </div>
          <button type="submit" class="btn btn-primary w-100">Create Account</button>
        </form>
        <p class="text-center text-secondary mt-3 mb-0" style="font-size:.85rem">
          Already registered?
          <a href="{{ url_for('login') }}" class="text-info text-decoration-none">Login</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
